<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPCODL Login</title>

    <link rel="stylesheet" href="assets/CSS/font-awesome/css/all.css">
    <link rel="stylesheet" href="assets/CSS/landing.css">
    <link href="assets/CSS/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <!-- HEADER -->
    <main class="landing-page">

        <header class="header">
            <div class="header-left">
                <!-- Replace with your actual logo <img> tag -->
                <div class="logo">
                    <img src="assets/IMAGES/Frame 75.png" alt="TPCODL Logo">
                </div>
                <div class="header-divider"></div>
                <div class="header-title">
                    <span class="main-title">Utility Data System</span>
                </div>
            </div>
            <div class="header-right">
                <div class="profile-block">
                    <div class="profile-icon"><i class="fas fa-user"></i></div>
                    <span class="user">madhuri.madhumeeta</span>
                </div>
                <div class="header-divider"></div>
                <button class="logout-btn" title="Logout">
                    <i class="fas fa-power-off"></i>
                </button>
                <div class="header-divider"></div>
                <div class="mode-toggle" id="modeToggle" title="Toggle light/dark mode">
                    <label class="mode-toggle" title="Toggle light/dark mode">
                        <input type="checkbox" id="modeToggle" hidden />
                        <span class="toggle-track">
                            <span class="toggle-thumb"></span>
                        </span>
                    </label>
                </div>

            </div>
        </header>


        <!-- CARDS -->
        <div class="cards-container">

            <!-- TOP ROW -->
            <div class="row g-3 mb-3">

                <!-- MDM -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="app-card">
                        <div class="card-image">
                            <img src="assets/IMAGES/MDM.png" alt="MDM">
                        </div>
                        <div class="card-footer">
                            <div class="card-info">
                                <p class="card-name">Meter Data Management System</p>
                                <p class="card-abbr">(MDM)</p>
                            </div>
                            <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
                        </div>
                    </div>
                </div>

                <!-- RvP -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="app-card">
                        <div class="card-image">
                            <img src="assets/IMAGES/RPS.png" alt="RvP">
                        </div>
                        <div class="card-footer">
                            <div class="card-info">
                                <p class="card-name">Revenue Protection System</p>
                                <p class="card-abbr">(RvP)</p>
                            </div>
                            <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
                        </div>
                    </div>
                </div>

                <!-- EA -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="app-card">
                        <div class="card-image">
                            <img src="assets/IMAGES/EA.png" alt="EA">
                        </div>
                        <div class="card-footer">
                            <div class="card-info">
                                <p class="card-name">Energy Audit</p>
                                <p class="card-abbr">(EA)</p>
                            </div>
                            <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- BOTTOM ROW -->
            <div class="row g-3 justify-content-center">

                <!-- SPM -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="app-card">
                        <div class="card-image">
                            <img src="assets/IMAGES/SPBS.png" alt="SPM">
                        </div>
                        <div class="card-footer">
                            <div class="card-info">
                                <p class="card-name">Smart Prepay Billing System</p>
                                <p class="card-abbr">(SPM)</p>
                            </div>
                            <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
                        </div>
                    </div>
                </div>

                <!-- BDR -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="app-card">
                        <div class="card-image">
                            <img src="assets/IMAGES/BDR.png" alt="BDR">
                        </div>
                        <div class="card-footer">
                            <div class="card-info">
                                <p class="card-name">Behavioral Demand Response</p>
                                <p class="card-abbr">(BDR)</p>
                            </div>
                            <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>





</body>

</html>
