<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPCODL Login</title>

    <link rel="stylesheet" href="assets/CSS/font-awesome/css/all.css">
    <link rel="stylesheet" href="assets/CSS/equipment.css">
    <link href="assets/CSS/bootstrap.min.css" rel="stylesheet">

</head>

<body>


    <!-- Mobile backdrop -->
    <div class="sidebar__overlay" id="sidebarOverlay"></div>

    <main class="dashboard">
        <main-sidebar></main-sidebar>

        <div class="content-wrapper">
            <main-topbar></main-topbar>

            <div class="main-content">
                <div class="page-tabs">
                    <button class="page-tab active">Home</button>
                    <button class="page-tab">View Details</button>
                    <button class="page-tab">Register Data</button>
                    <button class="page-tab">Interval Data</button>
                    <button class="page-tab">Alarm/Event Data</button>
                    <button class="page-tab">Instantaneous Data</button>
                    <button class="page-tab">Usage Data</button>
                    <button class="page-tab">Billing Data</button>
                    <button class="page-tab">Command History</button>
                    <button class="page-tab">Exception</button>
                    <button class="page-tab">Name Plate Details</button>
                </div>

                <div class="section-card">
                    <div class="section-card__header">
                        <span class="section-card__title">Equipment</span>
                    </div>
                    <div class="section-card__body">

                        <!-- Row 1 -->
                        <div class="filter-grid">
                            <div class="form-field">
                                <input type="text" class="form-field__input" id="enterId" placeholder=" "
                                    value="67289126518929" />
                                <label class="form-field__label" for="enterId">Enter ID</label>
                            </div>
                            <div class="form-field">
                                <div class="form-field__select-wrap">
                                    <select class="form-field__select" id="selectHes">
                                        <option value="">Select HES</option>
                                        <option>HES 1</option>
                                        <option>HES 2</option>
                                        <option>HES 3</option>
                                    </select>
                                </div>
                                <label class="form-field__label" for="selectHes">Select HES</label>
                            </div>
                            <div class="form-field">
                                <input type="text" class="form-field__input" id="meterId" placeholder=" " />
                                <label class="form-field__label" for="meterId">Meter ID</label>
                            </div>
                            <div class="form-field">
                                <input type="text" class="form-field__input" id="consumerId" placeholder=" " />
                                <label class="form-field__label" for="consumerId">Consumer ID</label>
                            </div>
                        </div>

                        <!-- Row 2 -->
                        <div class="filter-grid filter-grid--3">
                            <div class="form-field">
                                <input type="text" class="form-field__input" id="meterId" placeholder=" " />
                                <label class="form-field__label" for="meterId">Utility ID</label>
                            </div>
                            <div class="form-field">
                                <div class="form-field__select-wrap">
                                    <select class="form-field__select" id="selectHes">
                                        <option value="">Select HES</option>
                                        <option>HES 1</option>
                                        <option>HES 2</option>
                                        <option>HES 3</option>
                                    </select>
                                </div>
                                <label class="form-field__label" for="selectHes">Select HES</label>
                            </div>
                            <div class="form-field">
                                <input type="text" class="form-field__input" id="meterId" placeholder=" " />
                                <label class="form-field__label" for="meterId">Material ID</label>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="filter-actions">
                            <button class="btn-tp btn-tp-primary">
                                <i class="fa-solid fa-magnifying-glass"></i> Search
                            </button>
                            <button class="btn-tp btn-tp-warning">
                                <i class="fa-solid fa-rotate-right"></i> Reset
                            </button>
                            <button class="btn-tp btn-tp-secondary">
                                <i class="fa-solid fa-file-export"></i> Export All
                            </button>
                        </div>

                    </div>
                </div>

                <div class="section-card">
                    <div class="section-card__header">
                        <span class="section-card__title">Equipment Table View</span>
                    </div>
                    <div class="section-card__body">
                       

                    </div>
                </div>


            </div>
            <main-footer></main-footer>
        </div>

    </main>


    <script src="assets/CSS/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="assets/JS/theme.js"></script>
    <script src="assets/Pages/sidebar.js"></script>
    <script src="assets/Pages/footer.js"></script>
    <script src="assets/Pages/header.js"></script>
    <script src="assets/JS/jquery-3.7.1.js"></script>
    <script src="assets/JS/customTable.js"></script>

</body>

</html>
