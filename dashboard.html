<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPCODL Login</title>

    <link rel="stylesheet" href="assets/CSS/font-awesome/css/all.css">
    <link rel="stylesheet" href="assets/CSS/dashboard.css">
    <link href="assets/CSS/bootstrap.min.css" rel="stylesheet">

</head>

<body>


    <!-- Mobile backdrop -->
    <div class="sidebar__overlay" id="sidebarOverlay"></div>

    <main class="dashboard">
        <main-sidebar></main-sidebar>

        <div class="content-wrapper">
            <main-topbar></main-topbar>
            <!-- MAIN CONTENT (placeholder) -->
            <div class="main-content">



                <div class="stat-cards">

                    <div class="stat-card">
                        <div class="stat-card__header">
                            <div class="stat-card__icon ">
                                <i class="fa-solid fa-gauge-high"></i>
                            </div>
                            <span class="stat-card__label">Total Meter</span>

                        </div>
                        <div class="stat-card__bottom">
                            <div class="stat-card__value">147.7K</div>
                            <span class="stat-card__badge stat-card__badge--up">
                                28.4% <i class="fa-solid fa-arrow-trend-up"></i>
                            </span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__header">
                            <div class="stat-card__icon ">
                                <i class="fa-solid fa-plug-circle-check"></i>
                            </div>
                            <span class="stat-card__label">Meter Installed</span>

                        </div>
                        <div class="stat-card__bottom">
                            <div class="stat-card__value">15.6K</div>
                            <span class="stat-card__badge stat-card__badge--down">
                                12.6% <i class="fa-solid fa-arrow-trend-down"></i>
                            </span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__header">
                            <div class="stat-card__icon ">
                                <i class="fa-solid fa-microchip"></i>
                            </div>
                            <span class="stat-card__label">Smart Prepaid</span>

                        </div>
                        <div class="stat-card__bottom">
                            <div class="stat-card__value">1.2M</div>
                            <span class="stat-card__badge stat-card__badge--up">
                                28.4% <i class="fa-solid fa-arrow-trend-up"></i>
                            </span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__header">
                            <div class="stat-card__icon ">
                                <i class="fa-solid fa-users"></i>
                            </div>
                            <span class="stat-card__label">Total Users</span>

                        </div>
                        <div class="stat-card__bottom">
                            <div class="stat-card__value">50.8K</div>
                            <span class="stat-card__badge stat-card__badge--up">
                                28.4% <i class="fa-solid fa-arrow-trend-up"></i>
                            </span>
                        </div>
                    </div>

                </div>

                <div class="charts-row">

                    <!-- Main Area Chart -->
                    <div class="chart-card chart-card--main">
                        <div class="chart-card__header">
                            <div>
                                <p class="chart-card__title"> Total Revenue</p>
                                <div class="chart-card__value">
                                    240.8K
                                    <span class="stat-card__badge stat-card__badge--up chart" style="font-size:11px;">
                                        <i class="fa-solid fa-arrow-trend-up"></i> 24.6%
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="chart-card__body">
                            <canvas id="mainAreaChart"></canvas>
                            <!-- Tooltip -->
                            <div class="chart-tooltip" id="chartTooltip" style="display:none;">
                                <div class="chart-tooltip__value">125.2k <span
                                        class="stat-card__badge stat-card__badge--up"
                                        style="font-size:10px;padding:2px 6px;"><i
                                            class="fa-solid fa-arrow-trend-up chart"></i>
                                        12.5%</span></div>
                                <div class="chart-tooltip__date">June 21, 2026</div>
                            </div>
                        </div>
                    </div>

                    <div class="chart-side">

                        <div class="chart-card chart-card--mini">
                            <div class="chart-card__mini-header">
                                Daily Meter Installation <i class="fa-solid fa-chart-line"></i>
                            </div>
                            <div class="chart-card__mini-value">
                                144.6K
                                <span class="stat-card__badge stat-card__badge--up chart"
                                    style="font-size:10px;padding:2px 6px;">
                                    <i class="fa-solid fa-arrow-trend-up"></i> 28.5%
                                </span>
                            </div>
                            <div class="chart-card__body--mini">
                                <canvas id="dailyBarChart"></canvas>
                            </div>
                            <div class="chart-card__mini-footer">
                                <span class="text-muted">Last 12 months</span>
                                <a href="#" class="link-accent">View report</a>
                            </div>
                        </div>


                    </div>
                </div>

                <div class="charts-row--full">
                    <div class="chart-card chart-card--trend">

                        <div class="chart-card__header">
                            <div>
                                <p class="chart-card__title">Monthly Trend</p>
                                <div class="chart-card__value">
                                    2.4M
                                    <span class="stat-card__badge stat-card__badge--up chart" style="font-size:11px;">
                                        <i class="fa-solid fa-arrow-trend-up"></i> 18.2%
                                    </span>
                                </div>
                            </div>

                        </div>

                        <div class="chart-card__body chart-card__body--trend">
                            <canvas id="trendChart"></canvas>
                        </div>

                    </div>
                </div>


            </div>
            <main-footer></main-footer>
        </div>


    </main>


    <script src="assets/CSS/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script>
        (function () {
            // ── Colour tokens ────────────────────────────────────────
            const accent = '#00C896';
            const accentLt = 'rgba(0,200,150,0.15)';
            const blue = '#38BDF8';
            const blueLt = 'rgba(56,189,248,0.15)';
            const muted = '#7EADA6';
            const gridCol = 'rgba(0,0,0,0.06)';

            Chart.defaults.font.family = "'Outfit', sans-serif";
            Chart.defaults.font.size = 11;
            Chart.defaults.color = muted;

            // ── 1. Main area chart ───────────────────────────────────
            const months = ['Jul-25', 'Aug-25', 'Sep-25', 'Oct-25', 'Nov-25', 'Dec-25', 'Jan-26', 'Feb-26', 'Mar-26', 'Apr-26', 'May-26', 'Jun-26'];

            const installed = [31100, 26200, 24000, 30000, 34800, 35200, 38400, 39600, 50200, 34400, 31900, 11100];

            const mainCtx = document.getElementById('mainAreaChart').getContext('2d');

            // Green gradient
            const gGrad = mainCtx.createLinearGradient(0, 0, 0, 280);
            gGrad.addColorStop(0, 'rgba(0,200,150,0.55)');
            gGrad.addColorStop(1, 'rgba(0,200,150,0.02)');

            new Chart(mainCtx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [
                        {
                            label: 'Installed',
                            data: installed,
                            borderColor: accent,
                            backgroundColor: gGrad,
                            borderWidth: 2.5,
                            fill: true,
                            tension: 0.45,
                            pointRadius: 4,
                            pointBackgroundColor: accent,
                            pointHoverRadius: 6,
                            pointHoverBackgroundColor: accent,
                            pointHoverBorderColor: '#fff',
                            pointHoverBorderWidth: 2,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                boxWidth: 12,
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle',
                                color: muted,
                            }
                        },
                        tooltip: {
                            backgroundColor: '#fff',
                            titleColor: '#1A2E2B',
                            bodyColor: muted,
                            borderColor: '#EDF2F0',
                            borderWidth: 1,
                            padding: 12,
                            cornerRadius: 10,
                            callbacks: {
                                label: ctx => ` ${(ctx.raw / 1000).toFixed(1)}K`,
                            }
                        },
                        datalabels: {
                            align: 'top',
                            anchor: 'end',
                            offset: 6,
                            color: '#1A2E2B',
                            font: { weight: '600', size: 11 },
                            formatter: v => (v / 1000).toFixed(1) + 'K',
                        },
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            border: { display: false },
                            ticks: { color: muted },
                        },
                        y: {
                            min: 0,
                            max: 60000,
                            ticks: {
                                color: muted,
                                callback: v => v >= 1000 ? (v / 1000) + 'K' : v,
                                stepSize: 10000,
                            },
                            grid: { color: gridCol },
                            border: { display: false },
                        },
                    },
                },
            });

            // ── 2. Daily bar chart ───────────────────────────────────
            const pieCtx = document.getElementById('dailyBarChart').getContext('2d');

            new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: ['Installed', 'Instock'],
                    datasets: [
                        {
                            data: [881200, 203700],
                            backgroundColor: ['#00C896', '#F5C842'],
                            borderWidth: 0,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle',
                                color: muted,
                            },
                        },
                        tooltip: {
                            callbacks: {
                                label: ctx => ` ${ctx.label}: ${(ctx.raw / 1000).toFixed(1)}K`,
                            },
                        },
                        datalabels: {
                            color: '#1A2E2B',
                            font: { weight: '600', size: 11 },
                            formatter: v => (v / 1000).toFixed(1) + 'K',
                        },
                    },
                },
            });


            // ── 3. Trend chart ───────────────────────────────────
            const trendCtx = document.getElementById('trendChart').getContext('2d');

            const trendGrad = trendCtx.createLinearGradient(0, 0, 220, 0);
            trendGrad.addColorStop(0, 'rgba(0,200,150,0.2)');
            trendGrad.addColorStop(1, 'rgba(0,200,150,0.0)');

            new Chart(trendCtx, {
                type: 'bar',
                data: {
                    labels: ['SEEC KALAHANDI', 'SEEC BALANGIR', 'SEEC ROURKELA', 'EEC SAMBALPUR', 'SEEC BARGARH', 'NA'],
                    datasets: [
                        {
                            label: 'Installed',
                            data: [181400, 178300, 162500, 160700, 152100, 45400],
                            backgroundColor: trendGrad,
                            borderColor: accent,
                            borderWidth: 2,
                            borderRadius: 6,
                            borderSkipped: false,
                        },
                    ],
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                boxWidth: 12,
                                padding: 20,
                                usePointStyle: true,
                                pointStyle: 'circle',
                                color: muted,
                            }
                        },
                        tooltip: { enabled: true },
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: muted,
                                callback: v => (v / 1000) + 'K',
                            },
                            grid: { color: gridCol },
                            border: { display: false },
                        },
                        y: {
                            grid: { display: false },
                            border: { display: false },
                            ticks: { color: muted },
                        },
                    },
                },
            });
        })();
    </script>

    <script src="assets/JS/theme.js"></script>
    <script src="assets/Pages/sidebar.js"></script>
    <script src="assets/Pages/footer.js"></script>
    <script src="assets/Pages/header.js"></script>

</body>

</html>
